<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A curated poem selected every ten minutes.">
  <title>abj.lol</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #fbfaf6;
      --ink: #171717;
      --muted: #6a6760;
      --line: #ded8ca;
      --accent: #9b3f2f;
      --surface: rgba(251, 250, 246, 0.92);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }



    body[data-theme="broadcast"] {
      --paper: #070707;
      --ink: #f7f7ef;
      --muted: #a9a99f;
      --line: #2f2f2a;
      --accent: #e7ff55;
      --surface: rgba(10, 10, 10, 0.84);
      background:
        radial-gradient(circle at 50% 20%, rgba(231, 255, 85, 0.18), transparent 28rem),
        linear-gradient(#070707, #11110d);
    }









    main {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(1rem, 3vw, 2.75rem);
    }

    .topbar,
    .footer {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      color: var(--muted);
      font-size: 0.84rem;
      letter-spacing: 0.04em;
    }

    .footer .actions {
      margin-top: 0;
      margin-left: auto;
      justify-content: flex-end;
    }

    .brand {
      color: var(--ink);
      font-weight: 700;
      text-decoration: none;
    }

    button,
    a.button {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 0.42rem 0.7rem;
      font: inherit;
      cursor: pointer;
      text-decoration: none;
    }

    button[aria-pressed="true"] {
      border-color: var(--accent);
      color: var(--ink);
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .poem-shell {
      align-self: center;
      width: min(68rem, 100%);
      margin: clamp(2rem, 6vw, 5rem) auto;
      transition: all 240ms ease;
    }

    .kicker {
      margin: 0 0 1rem;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 12ch;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3rem, 10vw, 9rem);
      line-height: 0.9;
      letter-spacing: -0.075em;
    }

    .meta {
      margin: 1rem 0 clamp(2rem, 5vw, 4rem);
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.2rem);
    }

    blockquote {
      margin: 0;
      white-space: pre-line;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.45rem, 4vw, 3.8rem);
      line-height: 1.18;
      letter-spacing: -0.035em;
    }

    .credit {
      margin-top: clamp(2rem, 5vw, 4rem);
      color: var(--muted);
      line-height: 1.6;
    }

    .credit a { color: inherit; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1.25rem;
    }

    body[data-theme="broadcast"] .poem-shell {
      display: grid;
      grid-template-columns: 1fr;
      justify-items: center;
      text-align: center;
      text-transform: uppercase;
    }

    body[data-theme="broadcast"] h1 {
      max-width: none;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: clamp(3.8rem, 17vw, 13rem);
      letter-spacing: -0.065em;
    }

    body[data-theme="broadcast"] blockquote {
      max-width: 28ch;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.6rem, 4.6vw, 4.2rem);
      line-height: 1.12;
      letter-spacing: -0.04em;
      color: var(--accent);
      text-transform: none;
    }

    @media (max-width: 760px) {
      .topbar,
      .footer { align-items: flex-start; flex-direction: column; }
      .footer .actions { margin-left: 0; justify-content: flex-start; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body data-theme="broadcast">
  <main>
    <header class="topbar">
      <a class="brand" href="/">abj.lol</a>
    </header>

    <article class="poem-shell" aria-labelledby="poem-title">
      <div class="poem-heading">
        <p class="kicker" id="selection-label">Selected every ten minutes</p>
        <h1 id="poem-title">Loading</h1>
        <p class="meta" id="poem-meta"></p>
      </div>
      <div class="poem-body">
        <blockquote id="poem-text"></blockquote>
        <div class="credit">
          <span id="poem-credit"></span>
        </div>
      </div>
    </article>

    <footer class="footer">
      <span id="local-time"></span>
      <span>A poem, selected for this visit.</span>
      <div class="actions" aria-label="Poem actions">
        <button type="button" id="another-poem">Another poem</button>
        <a class="button" id="source-link" href="https://www.gutenberg.org/" target="_blank" rel="noreferrer">Source</a>
        <a class="button" id="permalink" href="/">Permalink</a>
      </div>
    </footer>
  </main>

  <script src="poems.js"></script>
  <script>
    (function () {
      const poems = POEMS;

      const body = document.body;
      const title = document.getElementById("poem-title");
      const meta = document.getElementById("poem-meta");
      const text = document.getElementById("poem-text");
      const credit = document.getElementById("poem-credit");
      const sourceLink = document.getElementById("source-link");
      const permalink = document.getElementById("permalink");
      const localTime = document.getElementById("local-time");
      const anotherPoem = document.getElementById("another-poem");

      function tenMinuteSlot(date) {
        return (date.getHours() * 6) + Math.floor(date.getMinutes() / 10);
      }

      function selectedPoem(date) {
        return poems[tenMinuteSlot(date)] || poems[0];
      }

      function poemFromUrl() {
        const id = new URLSearchParams(window.location.search).get("poem");
        return poems.find((poem) => poem.id === id);
      }



      function applyPoemPalette(poem) {
        if (body.dataset.theme !== "broadcast" || !poem.palette) return;
        body.style.setProperty("--paper", poem.palette.paper);
        body.style.setProperty("--ink", poem.palette.ink);
        body.style.setProperty("--muted", poem.palette.muted);
        body.style.setProperty("--line", poem.palette.line);
        body.style.setProperty("--accent", poem.palette.accent);
        body.style.setProperty("--surface", poem.palette.surface);
        body.style.background = "radial-gradient(circle at 50% 18%, " + poem.palette.glow + ", transparent 28rem), linear-gradient(" + poem.palette.paper + ", " + poem.palette.paper + ")";
      }

      function resetInlinePalette() {
        body.style.removeProperty("--paper");
        body.style.removeProperty("--ink");
        body.style.removeProperty("--muted");
        body.style.removeProperty("--line");
        body.style.removeProperty("--accent");
        body.style.removeProperty("--surface");
        body.style.background = "";
      }

      function renderPoem(poem, updateUrl) {
        const now = new Date();
        const isLinkedPoem = poem.format === "linked";
        resetInlinePalette();
        applyPoemPalette(poem);
        title.textContent = poem.title;
        meta.textContent = poem.author;
        text.textContent = poem.text;
        text.hidden = !poem.text;
        credit.textContent = isLinkedPoem ? "Available at " + poem.source : poem.source;
        sourceLink.href = poem.sourceUrl;
        sourceLink.textContent = isLinkedPoem ? "Read poem" : "Source";
        permalink.href = "?poem=" + encodeURIComponent(poem.id);
        localTime.textContent = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        if (updateUrl) {
          const params = new URLSearchParams(window.location.search);
          params.set("poem", poem.id);
          window.history.replaceState({}, "", "?" + params.toString());
        }
      }


      anotherPoem.addEventListener("click", () => {
        const currentId = new URLSearchParams(window.location.search).get("poem");
        const choices = poems.filter((poem) => poem.id !== currentId);
        renderPoem(choices[Math.floor(Math.random() * choices.length)] || poems[0], true);
      });

      const initialPermalinkPoem = poemFromUrl();
      renderPoem(initialPermalinkPoem || selectedPoem(new Date()), Boolean(initialPermalinkPoem));

      if (!initialPermalinkPoem) {
        window.setInterval(() => renderPoem(selectedPoem(new Date()), false), 60000);
      }
    })();
  </script>
</body>
</html>
